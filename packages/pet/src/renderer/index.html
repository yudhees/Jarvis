<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Jarvis</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div class="bubble hidden" id="bubble" role="status" aria-live="polite">
    <div class="who"><span id="bubbleWho">Jarvis</span><span class="badge" id="bubbleBadge" hidden></span></div>
    <div class="text" id="bubbleText"></div>
    <div class="say" id="bubbleSay" hidden></div>
    <form class="ask" id="ask" hidden autocomplete="off">
      <div class="choices" id="choices"></div>
      <div class="typed" id="typed">
        <input id="answer" type="text" maxlength="500" aria-label="Your answer">
        <button type="submit" class="send">Send</button>
      </div>
      <div class="ask-foot">
        <span>or just say it</span>
        <button type="button" class="link" id="skip">Skip</button>
      </div>
    </form>
  </div>

  <div class="pet" id="pet" data-look="robot" data-state="SLEEPING" data-tool="off" data-budget="ok">
    <svg viewBox="0 0 160 160" role="img" aria-label="Jarvis">
      <g class="body">
        <circle class="ring" id="ring" cx="80" cy="82" r="62"/>
        <rect class="outline" x="14" y="22" width="132" height="126" rx="36"/>
        <line class="antenna" x1="80" y1="34" x2="80" y2="20"/>
        <circle class="antenna-light" cx="80" cy="17" r="5"/>
        <rect class="hand left" x="18" y="98" width="16" height="30" rx="8"/>
        <rect class="hand right" x="126" y="98" width="16" height="30" rx="8"/>
        <rect class="shell" x="28" y="32" width="104" height="104" rx="34"/>
        <rect class="visor" x="40" y="52" width="80" height="50" rx="22"/>
        <circle class="orb" cx="80" cy="82" r="48"/>
        <g class="art art-cat"><path class="a-shell" d="M34 64 L40 20 L70 46 Z M126 64 L120 20 L90 46 Z"/><path class="a-inner" d="M42 52 L44 32 L60 46 Z M118 52 L116 32 L100 46 Z"/><ellipse class="a-shell" cx="80" cy="86" rx="54" ry="48"/><ellipse class="a-face" cx="80" cy="80" rx="38" ry="27"/><path class="a-line" d="M40 94 L18 90 M40 100 L18 104 M120 94 L142 90 M120 100 L142 104"/></g>
        <g class="art art-bear"><circle class="a-shell" cx="40" cy="42" r="17"/><circle class="a-shell" cx="120" cy="42" r="17"/><circle class="a-face" cx="40" cy="42" r="8"/><circle class="a-face" cx="120" cy="42" r="8"/><circle class="a-shell" cx="80" cy="86" r="54"/><rect class="a-face" x="44" y="56" width="72" height="48" rx="24"/></g>
        <g class="art art-ghost"><path class="a-glowline" d="M30 134 V80 A50 50 0 0 1 130 80 V134 l-12.5 -10 l-12.5 10 l-12.5 -10 l-12.5 10 l-12.5 -10 l-12.5 10 l-12.5 -10 l-12.5 10 Z"/></g>
        <g class="art art-tv"><path class="a-line" d="M80 34 L60 12 M80 34 L100 12"/><rect class="a-shell" x="22" y="34" width="116" height="96" rx="18"/><rect class="a-face" x="34" y="48" width="78" height="60" rx="14"/><circle class="a-knob" cx="124" cy="62" r="5"/><circle class="a-knob" cx="124" cy="80" r="5"/><path class="a-line" d="M44 130 L38 144 M116 130 L122 144"/></g>
        <image class="logo" id="logo" x="28" y="32" width="104" height="104" preserveAspectRatio="xMidYMid meet"/>
        <ellipse class="eye" cx="64" cy="75" rx="7" ry="9"/>
        <ellipse class="eye" cx="96" cy="75" rx="7" ry="9"/>
        <path class="lid" d="M57 77 q7 5 14 0 M89 77 q7 5 14 0"/>
        <path class="spiral" d="M64 75 m-6 0 a6 6 0 1 1 6 6 a4 4 0 1 1 -4 -4 M96 75 m-6 0 a6 6 0 1 1 6 6 a4 4 0 1 1 -4 -4"/>
        <circle class="cheek" cx="50" cy="92" r="5"/>
        <circle class="cheek" cx="110" cy="92" r="5"/>
        <rect class="mouth" id="mouth" x="72" y="88" width="16" height="4" rx="2"/>
        <g class="think-dots"><circle cx="80" cy="6" r="3.2"/><circle cx="100" cy="12" r="2.6" opacity=".7"/><circle cx="60" cy="12" r="2.2" opacity=".45"/></g>
        <g class="model-tag" transform="translate(112 30)"><rect width="26" height="20" rx="6"/><text id="modelTag" x="13" y="14.5" text-anchor="middle">H</text></g>
        <text class="zz" x="118" y="34">z</text>
        <text class="qmark" x="114" y="30">?</text>
        <g class="held" id="held" transform="translate(132 78)"></g>
        <g class="rec-dot"><circle cx="30" cy="40" r="5"/></g>
        <g class="mute-icon" transform="translate(52 140)">
          <rect width="56" height="16" rx="8"/>
          <text x="28" y="11.5" text-anchor="middle">mic off</text>
        </g>
        <g class="battery" transform="translate(16 30)">
          <rect class="b-case" width="22" height="12" rx="3"/>
          <rect class="b-tip" x="22" y="3.5" width="3" height="5" rx="1"/>
          <rect class="b-fill" x="2.5" y="2.5" width="5" height="7" rx="1"/>
        </g>
      </g>
    </svg>
  </div>
  <script src="pet.js"></script>
</body>
</html>
