# Main settings (CLAUDE.md). Invalid values stop Jarvis from starting.

# Where Jarvis keeps its database, audit log, and models. %VARS% are expanded.
dataDir: "%APPDATA%/jarvis"

audio:
  sampleRate: 16000 # fixed: Picovoice engines use 16 kHz
  frameLength: 512 # samples per mic frame (32 ms)
  inputDevice: -1 # -1 = Windows default; list with: npm run mic-test -- --list
  outputDevice: -1 # -1 = Windows default; list with: npm run speaker-test -- --list

listening:
  maxRecordSeconds: 15
  followUpSeconds: 8
  silenceMs: 800 # this much quiet ends what you are saying
  startTimeoutSeconds: 5 # after "Jarvis", give up if you say nothing

keywords: # Porcupine (needs a Picovoice AccessKey: npm run set-key -- picovoice)
  wake: jarvis # built-in keyword; later a custom "Hi Jarvis" .ppn path
  stop: null # path to a "Jarvis stop" .ppn; null = saying "Jarvis" interrupts
  sensitivity: 0.5 # 0..1, higher wakes more easily (and falsely)

approval:
  timeoutSeconds: 20

tasks:
  maxTurns: 25
  maxSeconds: 300
  maxIdenticalToolCalls: 3

latency: # first spoken word budgets (section 7.1)
  instantSeconds: 2
  normalSeconds: 6

voice:
  provider: windows-sapi
  voice: null # null = Windows default, or e.g. "Microsoft Zira Desktop"
  rate: 0 # -10 (slow) .. 10 (fast)
  requestTimeoutSeconds: 30

budget: # open decision (section 17); null = not set yet
  dailyCostUsd: null
  dailyTokens: null

files:
  allowedFolders: [] # open decision (section 17)

retention:
  transcriptDays: 30

stt: # speech-to-text: turns what you say into text for Claude
  provider: whisper-cpp # runs on this PC; install with: npm run setup-whisper
  model: ggml-base.en-q8_0.bin # bigger and more accurate: ggml-small.en-q5_1.bin
  language: en
  threads: 4
  port: 8178 # local whisper-server, bound to 127.0.0.1 only
  idleStopSeconds: 60 # unload the model after a minute of no speech (frees ~140 MB RAM); 0 = keep loaded

learning:
  enabled: true
  aboutUserTokenCap: 300

# Claude Code skills installed on this PC (~/.claude/skills and plugins) that
# Jarvis may follow. Only the best matches for a request are loaded.
skills:
  enabled: true
  maxPerRequest: 2 # skills listed by name per request; Jarvis reads one only when it needs it
  # Skills about operating Claude Code itself; not useful for a voice assistant.
  exclude:
    - using-superpowers
    - diagnosing-superpowers
    - writing-skills
    - skill-creator
    - find-skills
    - import-memory
    - using-git-worktrees
  # Folders with your own .md instruction files (Jira review, task creation,
  # moving tickets, Slack updates, ...). Every .md inside is offered as a skill.
  # Example: - "D:/Work/claude-prompts"
  extraDirs: []
